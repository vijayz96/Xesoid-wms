<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logizoid - Customer Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .client-layout { display: grid; grid-template-columns: 1.2fr 1fr; gap: 40px; padding: 40px 6%; flex: 1; width:100%; }
        .form-panel { background: rgba(0,0,0,0.8); padding: 35px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); height: fit-content; }
        .form-panel h2 { font-size: 24px; color: #ff7300; margin-bottom: 25px; font-weight: 700; }
        
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .input-box { display: flex; flex-direction: column; }
        .input-box label { font-size: 12px; color: #aaa; margin-bottom: 6px; font-weight: 600; text-transform: uppercase; }
        .input-box input, .input-box select { 
            background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.15); 
            padding: 12px; color: white; border-radius: 6px; font-size: 14px; outline: none;
        }
        .input-box input:focus { border-color: #ff7300; }

        .tracking-status-panel { background: rgba(5,10,20,0.5); padding: 35px; border-radius: 12px; border: 1px dashed rgba(255,255,255,0.15); }
        .track-card { background: rgba(255,255,255,0.02); border-left: 4px solid #ff7300; padding: 20px; border-radius: 6px; margin-top: 15px; }
        .track-timeline { display: flex; justify-content: space-between; margin-top: 15px; font-size: 11px; color: #aaa; position: relative;}
        .step { text-align: center; width: 25%; position: relative; }
        .step.done { color: #ff7300; font-weight: bold; }
    </style>
</head>
<body>

    <div class="hero-container">
        <header class="navbar">
            <div class="logo">Logi<span class="highlight">zoid Client Hub</span></div>
            <nav class="nav-menu">
                <a href="#" class="active">NEW REQUEST</a>
                <a href="#">MY CONSIGNMENTS</a>
                <a href="#">STATEMENTS</a>
                <a href="portal.html" style="color: #ff7300;">EXIT PORTAL</a>
            </nav>
        </header>

        <div class="client-layout">
            <!-- LEFT: SUBMIT PICKUP REQUEST -->
            <section class="form-panel">
                <h2>Request Cargo Pickup</h2>
                <form id="pickupForm">
                    <div class="form-row">
                        <div class="input-box">
                            <label>Origin Address / Hub</label>
                            <input type="text" id="origin" placeholder="City or Warehouse Address" required>
                        </div>
                        <div class="input-box">
                            <label>Destination Center</label>
                            <input type="text" id="dest" placeholder="Target Delivery Location" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="input-box">
                            <label>Estimated Weight (KG)</label>
                            <input type="number" id="weight" placeholder="Total cargo weight" required>
                        </div>
                        <div class="input-box">
                            <label>Package Type</label>
                            <select id="boxType">
                                <option value="Standard Boxes">Standard Carton Boxes</option>
                                <option value="Palletized Freight">Palletized Freight</option>
                                <option value="Loose Cargo">Loose Items / Parcel</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="btn-login" style="margin-top: 10px;">BOOK PICKUP ORDER</button>
                </form>
            </section>

            <!-- RIGHT: LIVE SHIPMENT TRACKER -->
            <section class="tracking-status-panel">
                <h2 style="font-size: 20px; font-weight: 700; margin-bottom: 5px;">Active Consignment Tracker</h2>
                <p style="color:#888; font-size:13px;">Review status updates straight from the warehouse floors.</p>
                
                <div id="clientTrackFeed">
                    <div class="track-card">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <h4 style="font-size:16px;">Order #XSD-99214</h4>
                            <span style="color:#ff7300; font-size:12px; font-weight:bold;">In Transit</span>
                        </div>
                        <p style="font-size:13px; color:#bbb; margin-top:5px;">Route: Mumbai Hub ➔ Delhi WMS</p>
                        
                        <div class="track-timeline">
                            <div class="step done">✓ Booked</div>
                            <div class="step done">✓ Picked Up</div>
                            <div class="step done">➔ Loaded</div>
                            <div class="step">WMS Stored</div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>
<!-- Include Firebase Core and Database SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<script>
    // Your exact Firebase configuration credentials
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY", // Replace with your real Firebase API Key
        authDomain: "xesoid-wms.firebaseapp.com",
        databaseURL: "https://xesoid-wms-default-rtdb.firebaseio.com/",
        projectId: "xesoid-wms"
    };
    
    // Initialize Firebase
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // Handle Form Submission
    document.getElementById('pickupForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        // Grab values entered by the customer
        const origin = document.getElementById('origin').value;
        const destination = document.getElementById('dest').value;
        const weight = document.getElementById('weight').value;
        const boxType = document.getElementById('boxType').value;
        const timestamp = Date.now();

        // Create a unique booking reference ID automatically
        const newBookingRef = database.ref('customer_requests').push();
        
        // Structure the data layout
        const requestData = {
            id: newBookingRef.key,
            origin: origin,
            destination: destination,
            weight_kg: weight,
            package_type: boxType,
            status: "Pending Officer Review",
            submitted_at: timestamp
        };

        // Push data straight to your Firebase cloud tree
        newBookingRef.set(requestData)
            .then(() => {
                alert(`Success! Request logged with ID: ${newBookingRef.key}`);
                // Clear the input fields for the next entry
                document.getElementById('pickupForm').reset();
            })
            .catch((error) => {
                alert("Error sending data to Firebase: " + error.message);
                console.error(error);
            });
    });
</script>

</body>
</html>

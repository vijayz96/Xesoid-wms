<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirect Successful ✅</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #0a0c12 0%, #1a1c2a 100%);
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .success-card {
            background: rgba(10, 12, 20, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 48px 32px;
            max-width: 500px;
            text-align: center;
            border: 2px solid #00c48c;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .checkmark {
            font-size: 80px;
            background: #00c48c;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            animation: bounce 0.6s ease;
        }
        @keyframes bounce {
            0%, 100% { transform: scale(0.8); }
            50% { transform: scale(1.1); }
        }
        h1 {
            color: #00c48c;
            font-size: 32px;
            margin-bottom: 16px;
        }
        p {
            color: #cbd5e6;
            line-height: 1.6;
            margin-bottom: 24px;
            font-size: 16px;
        }
        .redirect-path {
            background: #00000060;
            padding: 12px;
            border-radius: 12px;
            font-family: monospace;
            font-size: 14px;
            color: #ffaa66;
            margin-bottom: 24px;
            word-break: break-all;
        }
        button {
            background: #ff7300;
            color: #0a0c12;
            border: none;
            padding: 12px 28px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:hover {
            background: #ff9040;
            transform: scale(1.02);
        }
        .info {
            font-size: 12px;
            color: #888;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="success-card">
        <div class="checkmark">✅</div>
        <h1>Redirect Successful!</h1>
        <p>You have been successfully redirected to this page using the pattern:</p>
        <div class="redirect-path" id="redirectPath">../folder/page.html</div>
        <p style="font-size: 14px;">The navigation system is working correctly. All top menu links now use pure HTML redirects with relative paths.</p>
        <button onclick="goBack()">← Go Back to Dashboard</button>
        <div class="info">
            🔗 Redirect method: &lt;a href="../billing/billing.html"&gt;
        </div>
    </div>

    <script>
        // Display the actual path that was used to reach this page
        const pathDisplay = document.getElementById('redirectPath');
        if (pathDisplay) {
            pathDisplay.textContent = window.location.pathname || '../folder/page.html';
        }

        function goBack() {
            window.location.href = '../index.html';
        }

        // Alternative: if you came from a specific referrer, show that info
        if (document.referrer) {
            console.log('Redirected from:', document.referrer);
        }
    </script>
</body>
</html>

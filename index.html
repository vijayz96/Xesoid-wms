<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xesoid WMS - Login Gateway</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="hero-container">
        <header class="navbar">
            <div class="logo">Xesoid <span class="highlight">WMS</span></div>
        </header>

        <main class="content-wrapper">
            <section class="hero-text-section">
                <h1 class="main-heading">Logistics & <br><span class="highlight">Warehouse Management</span> <br>Platform</h1>
                <p class="sub-heading">Streamline your entire supply chain management network from booking requests to active warehouse tracking control platforms.</p>
            </section>

            <aside class="login-card-container">
                <div class="login-card">
                    <h2>Corporate Entry</h2>
                    <form id="mainLoginForm" class="login-form">
                        <div class="input-group">
                            <input type="email" id="mainEmail" placeholder="Enter Account Email" required>
                        </div>
                        <div class="input-group">
                            <input type="password" id="mainPassword" placeholder="Enter Password" required>
                        </div>
                        <button type="submit" class="btn-login">Verify Identity</button>
                    </form>
                    <p id="authError" style="color: #ff3333; margin-top: 15px; font-size: 13px; display: none;"></p>
                </div>
            </aside>
        </main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    
    <script>
        // Copy your exact Web App Credentials from Firebase Console Settings here
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "xesoid-wms.firebaseapp.com",
            databaseURL: "https://xesoid-wms-default-rtdb.firebaseio.com/",
            projectId: "xesoid-wms",
            storageBucket: "xesoid-wms.appspot.com",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        document.getElementById('mainLoginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('mainEmail').value;
            const password = document.getElementById('mainPassword').value;
            const errorText = document.getElementById('authError');

            auth.signInWithEmailAndPassword(email, password)
                .then(() => {
                    // Redirects to Selection Dashboard upon successful authentication
                    window.location.href = "portal.html";
                })
                .catch((error) => {
                    errorText.innerText = error.message;
                    errorText.style.display = "block";
                });
        });
    </script>
</body>
</html>

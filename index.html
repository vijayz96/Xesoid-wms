<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xesoid WMS - Entry</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="hero-container">
        <header class="navbar">
            <div class="logo">Xesoid <span class="highlight">WMS</span></div>
        </header>

        <main class="content-wrapper">
            <section class="hero-text-section">
                <h1 class="main-heading">Logistics & <br><span class="highlight">Warehouse Management</span> <br>Platform</h1>
                <p class="sub-heading">Streamline your entire supply chain management network from booking requests to active warehouse tracking control platforms.</p>
                <button onclick="window.location.href='portal.html'" class="btn-join" style="border:none; cursor:pointer;">ENTER SYSTEM</button>
            </section>

            <aside class="login-card-container">
                <div class="login-card">
                    <h2>Developer Access</h2>
                    <p style="color:#aaa; font-size:14px; margin-bottom:20px;">Authentication is currently disabled for rapid prototype testing.</p>
                    <button onclick="window.location.href='portal.html'" class="btn-login">Launch Portal Selection</button>
                </div>
            </aside>
        </main>
    </div>

</body>
</html>

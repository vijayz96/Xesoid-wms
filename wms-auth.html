<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS Terminal Authentication</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="hero-container">
        <header class="navbar">
            <div class="logo">WMS <span class="highlight">Terminal Gate</span></div>
        </header>
        <main class="content-wrapper" style="justify-content: center;">
            <div class="login-card" style="width: 400px;">
                <h2>Warehouse Authentication</h2>
                <form id="wmsForm" class="login-form">
                    <div class="input-group"><input type="password" id="wmsKey" placeholder="Enter Secure Warehouse Operator Key" required></div>
                    <button type="submit" class="btn-login">Boot WMS Workspace</button>
                </form>
            </div>
        </main>
    </div>
    <script>
        document.getElementById('wmsForm').addEventListener('submit', (e) => {
            e.preventDefault();
            window.location.href = "wms-dashboard.html";
        });
    </script>
</body>
</html>
